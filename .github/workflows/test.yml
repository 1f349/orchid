on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.27.x]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v7
    - run: go build ./cmd/orchid/
    - run: go test ./...
